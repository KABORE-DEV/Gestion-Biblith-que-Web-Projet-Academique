spring:
  application:
    name: library-management
  datasource:
    url: jdbc:postgresql://localhost:5432/BIBLIO
    username: postgres
    password: root1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Crée ou met à jour automatiquement les tables SQL par rapport aux entités Java
    show-sql: true # Affiche les requêtes SQL générées par Hibernate dans la console
    properties:
      hibernate:
        format_sql: true # Formate les requêtes SQL affichées pour une meilleure lisibilité
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
