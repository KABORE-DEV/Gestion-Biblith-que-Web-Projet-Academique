<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue — Bibliothèque Libris</title>
    <meta name="description" content="Explorez le catalogue de la bibliothèque Libris, classé par catégories.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body data-page="catalogue" data-depth="1" data-disposition="cards">

    <header class="page-hero">
        <h1>Explorez notre <em>catalogue</em></h1>
        <p>Des centaines d'ouvrages classés par catégories, pour tous les goûts.</p>
        <div class="cat-search">
            <input type="text" placeholder="Rechercher une catégorie..." class="recher" id="catalogueSearch">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <section class="section" style="padding-top: 40px;">
        <div class="cat-grid" id="categoryGrid"></div>
    </section>

    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/categories.js"></script>
    <script src="../assets/js/search.js"></script>
</body>

</html>
